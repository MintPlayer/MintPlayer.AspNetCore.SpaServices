# MintPlayer dependency updates (added by the onboarding pull request). Every line is a default: uncomment to change it.
# dependencies:
#   enabled: true
#   schedule: { frequency: weekly, weekday: monday, hour: 6 }   # in the account's time zone
#   cooldown: 3d                     # third-party releases wait this long; may only lengthen the account's
#   autoMerge:                       # the largest update merged through the merge queue without an approval
#     default: minor
#     "@angular/*": never            # never: every update waits for `approve <group>`
#     maxCoverageDrop: 0.5           # percentage points
#   rules:
#     - match: ["some-package"]
#       ignore: true
#   migrate:                         # approved majors run a migration workflow after the apply
#     - match: "@angular/core"
#       onMajor: angular-migrate.yml
#     - match: "nx"
#       onMajor: nx-migrate.yml

# Coverage gate policy for coverage.mintplayer.com.
#
# Overrides the repository's "Coverage gate" settings panel per field. Read from the BASE ref of a
# pull request - never from the head - so a PR cannot rewrite the policy that judges it. The
# practical consequence: this file does not gate the PR that introduces it. It starts enforcing on
# the first PR opened after it reaches master.
#
# Schema: MintPlayer.Spark/docs/code-coverage/upload-api.md. Unknown keys are silently ignored, and
# a malformed file is discarded whole (the stored panel settings then stand), so a typo here fails
# open rather than loud. Check the coverage/project and coverage/patch check runs after changing it.
gate:
  # Compare against a fixed target rather than ratcheting against the base commit.
  projectMode: fixed

  # Require 95% overall line coverage. Raised from 80% by docs/PLAN-Coverage-95.md, whose baseline
  # was 81.4% and which lands at roughly 96-97% on the Linux CI run. The remainder is mostly the
  # Windows-only Job Object branch in ProcessTracker, which Linux CI can never execute, and the thin
  # SystemNodeProcess adapter that only real node would drive. Because this file is read from the
  # base ref, the new target first applies to the PR after the one that raises it.
  projectTarget: 95

  # Tolerance BELOW the target, in percentage points. The rule is: head >= projectTarget -
  # projectThreshold. Zero makes it a strict >= 95%.
  projectThreshold: 0

  # Only consulted for builds the uploader declares partial, which this repository never does - the
  # two per-TFM reports merge into one whole-workspace build. Pinned to the honest option so that
  # if a partial upload is ever introduced it compares like for like instead of synthesising a
  # whole-workspace projection.
  projectBasis: scoped

  # Added or changed lines must be 90% covered. This is what actually keeps the number climbing:
  # it stops new uncovered code arriving, rather than relying on one-off pushes. Below the project
  # target on purpose: a small patch touching one platform-specific line would otherwise fail.
  patchTarget: 90
  patchThreshold: 0

  # Failed checks turn red. With this off, both checks post the same numbers but always conclude
  # "neutral" - which is exactly why coverage/project and coverage/patch read "skipping" today.
  blocking: true

# The merge queue (added by the onboarding pull request): dependency pull requests within your thresholds merge through
# it, and your own pull requests can use it too (label `merge-queue`, or comment `/queue`).
mergeQueue:
  enabled: true
  branches: [master, supported-lines]

# MintPlayer package versioning (added by the onboarding pull request). The publish workflow tags every release
# `<package id>/v<version>`; the commented lines are the defaults.
versioning:
  lines: {}                          # release lines, release/{ecosystem}-{major}.x: packages release only from them
  mode: server                       # server | local: local runs the engine on the runner, without the app
#   releaseBranches: ["release/*.x"]
#   ignore: ["**/*.md"]              # changed files that never release a package
#   prerelease: upstream             # alpha | beta | next | preview | rc pins the label; upstream mirrors dependencies and the SDK
#   groups:                         # packages that always share one version
#     - name: core
#       packages: [Acme.Core, Acme.Core.*]
#   packages:
#     Acme.Generators: { anchor: free }   # free, or the framework package whose major it follows
