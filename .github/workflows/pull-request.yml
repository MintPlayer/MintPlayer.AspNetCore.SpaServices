name: pull-request

on:
  pull_request:
    branches: [ master ]

jobs:
  build:

    name: pull-request
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0
      
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-rc.1.26425.128

    # The Node integration tests spawn real node processes, and the build runs npm in the demo
    # ClientApps. Pinned so a runner-image change cannot alter the Node the tests run against.
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    
    - name: Install dependencies
      run: dotnet restore
        
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      # --no-build --configuration Release: `--no-restore` alone does NOT imply --no-build, so
      # without this the solution gets built a second time in Debug and coverage is measured on that
      # build rather than the Release one just built above. The Debug rebuild also triggers
      # DebugEnsureNodeEnv in nodeservices.targets, which runs `npm install` in both demo ClientApps.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, one per test project, hence the ** in the upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release --verbosity normal
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    # Nothing here gates the merge. The coverage service publishes the `coverage/project` and
    # `coverage/patch` check runs itself, and those are what branch protection would require.
    - name: Upload coverage
      # Fork PRs get no secrets, so the upload cannot work there. Skip rather than fail - a
      # contributor's PR must not go red over a missing token.
      # hashFiles guard: a run that produced no report is a no-op.
      if: >
        github.event.pull_request.head.repo.full_name == github.repository
        && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      continue-on-error: true
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        disable-search: true
        base-sha: ${{ github.event.pull_request.base.sha }}
        # Closes the build now instead of waiting out the ~2-minute debounce, so the check runs
        # appear while the PR is still being looked at.
        finish: true
        # A coverage-service outage must never be the reason a PR cannot merge.
        fail-ci-if-error: false

  # The boot-module loader (import() of ES modules with chunks and top-level await, a .cjs entry script) runs
  # in whatever Node the app has. The build job above pins 22; this runs only the real-Node integration tests
  # against the other supported majors, without coverage, so the coverage upload above stays the only one.
  node-versions:

    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ '20', '24' ]

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-rc.1.26425.128

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}

    - name: Test
      run: >
        dotnet test MintPlayer.AspNetCore.SpaServices.Tests/MintPlayer.AspNetCore.SpaServices.Tests.csproj
        --configuration Release
        --filter "FullyQualifiedName~PrerendererNodeIntegrationTests"
