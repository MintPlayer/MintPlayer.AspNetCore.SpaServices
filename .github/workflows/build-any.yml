name: build-any

on:
  push:
    branches:
      - '**'
      - '!master'
      - '!release/**'

jobs:
  build:

    name: build-any
    runs-on: ubuntu-latest

    permissions: 
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0
      
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    # The Node integration tests spawn real node processes, and the build runs npm in the demo
    # ClientApps. Pinned so a runner-image change cannot alter the Node the tests run against.
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    
    - name: Install dependencies
      run: dotnet restore
        
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      # --no-build --configuration Release: `--no-restore` alone does NOT imply --no-build, so this
      # step used to rebuild the whole solution in Debug and test THAT, while the Build step above
      # produced Release. In this repo a Debug rebuild is especially costly: it satisfies the
      # `'$(Configuration)' == 'Debug'` condition on DebugEnsureNodeEnv in nodeservices.targets,
      # which runs `npm install` in both demo ClientApps.
      #
      # No coverage collection here on purpose: build-master and pull-request already upload, and a
      # feature-branch push would report a third build for the same commit.
      run: dotnet test --no-restore --no-build --configuration Release --verbosity normal
