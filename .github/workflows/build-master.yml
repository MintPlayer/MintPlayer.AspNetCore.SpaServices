name: build-master

on:
  push:
    branches:
      - 'master'
      # Release lines: `versioning.lines` in coverage.yml makes packages release only from their line,
      # release/<ecosystem>-<major>.x, so the lines version, pack and publish here too.
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    name: build-master
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      # Full history: MintPlayer.Versioning.MSBuild reads each version from the tags reachable from HEAD.
      with:
        fetch-depth: 0
      
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.0.100-rc.1.26425.128

    # The Node integration tests spawn real node processes, and the build runs npm in the demo
    # ClientApps. Pinned so a runner-image change cannot alter the Node the tests run against.
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    
    - name: Install dependencies
      run: dotnet restore
        
    - name: Build
      run: dotnet build --configuration Release --no-restore
      
    - name: Test
      # --no-build --configuration Release: `--no-restore` alone does NOT imply --no-build, so
      # without this the solution gets built a second time in Debug and coverage is measured on that
      # build while `dotnet pack` below ships the Release one. The Debug rebuild also triggers
      # DebugEnsureNodeEnv in nodeservices.targets, which runs `npm install` in both demo ClientApps.
      #
      # --collect writes coverage.cobertura.xml into a GUID-named subdirectory of
      # --results-directory, one per test project, hence the ** in the upload glob below.
      run: >
        dotnet test --no-restore --no-build --configuration Release --verbosity normal
        --settings coverlet.runsettings
        --collect:"XPlat Code Coverage" --results-directory coverage

    - name: Upload coverage
      # always(): coverage from a failing test run is still worth recording.
      # hashFiles guard: a run that produced no report is a no-op rather than an upload of nothing.
      if: always() && hashFiles('coverage/**/coverage.cobertura.xml') != ''
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/action@coverage-upload-v1
      with:
        url: https://coverage.mintplayer.com
        token: ${{ secrets.COVERAGE_TOKEN }}
        files: |
          coverage/**/coverage.cobertura.xml
        # With search on, a glob that matches nothing silently falls back to auto-detection and
        # would upload stray unparsable reports.
        disable-search: true
        # Closes the build now instead of waiting out the server's ~2-minute debounce.
        finish: true
        # A coverage-service outage, or a missing COVERAGE_TOKEN, must not fail this workflow before
        # `dotnet pack` and block a NuGet release.
        fail-ci-if-error: false

    - name: Version the packages
      id: versioning
      uses: MintPlayer/MintPlayer.Spark/apps/CodeCoverage/versioning-action@a0f9e20f3d7f91814d00c598c64b4a39cd1f1c45 # versioning-v1

    # With release lines on, the default branch tags nothing: packing it would only re-push the last
    # versions as duplicates, so it neither packs nor publishes when it released nothing.
    - name: Decide whether this run publishes
      id: publishes
      env:
        RELEASED: ${{ steps.versioning.outputs.released }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && { [ -z "$RELEASED" ] || [ "$RELEASED" = "[]" ]; }; then
          echo "The default branch released nothing (release lines on, or no change): no pack, no publish."
          echo "value=false" >> "$GITHUB_OUTPUT"
        else
          echo "value=true" >> "$GITHUB_OUTPUT"
        fi

    # No --no-build: the versions are decided after the tests, so pack builds again to stamp them into the
    # assemblies (--no-build also skips restore, which leaves the nuspec's dependency versions stale).
    - name: Pack
      if: steps.publishes.outputs.value == 'true'
      run: dotnet pack --configuration Release

    - name: Check the packages carry the released versions
      if: steps.publishes.outputs.value == 'true'
      id: packed-versions
      shell: bash
      env:
        VERSIONS: ${{ steps.versioning.outputs.versions }}
        DIST_TAGS: ${{ steps.versioning.outputs.dist-tags }}
      run: |
        # --skip-duplicate turns a pack at another version into "already exists" and a green run that published
        # nothing (#638): every released NuGet package must have been packed at the version it was released as.
        versions="${VERSIONS:-}"; [ -n "$versions" ] || versions='{}'
        npm="${DIST_TAGS:-}"; [ -n "$npm" ] || npm='{}'
        status=0
        while IFS=$'\t' read -r id version; do
          version="${version%$'\r'}"; [ -n "$id" ] || continue
          if [ -z "$(find . -iname "$id.$version.nupkg" -not -path '*/node_modules/*' -print -quit)" ]; then
            echo "::error::$id was released as $version, but no $id.$version.nupkg was packed."
            status=1
          fi
        done < <(jq -r --argjson npm "$npm" 'to_entries[] | select(.key as $k | $npm | has($k) | not) | "\(.key)\t\(.value)"' <<< "$versions")
        exit $status

    # Trusted publishing: the job's GitHub OIDC token (id-token: write) is exchanged for a short-lived
    # nuget.org API key. The policy lives on nuget.org (owner MintPlayer, workflow build-master.yml,
    # packages MintPlayer.AspNetCore.SpaServices*, MintPlayer.AspNetCore.NodeServices); a package outside
    # those patterns is refused. `user` is the nuget.org profile that owns the policy.
    - name: NuGet login (trusted publishing)
      id: nuget-login
      if: steps.publishes.outputs.value == 'true'
      uses: NuGet/login@v1
      with:
        user: Pieterjan

    - name: PushNuget
      if: steps.publishes.outputs.value == 'true'
      run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
     
    - name: PushGithub
      if: steps.publishes.outputs.value == 'true'
      # Explicit source: GitHub Packages is deliberately NOT a restore source on CI. A restore source answering
      # 403 for a package this repository's token may not read fails the whole restore (MintPlayer/MintPlayer.Dotnet.Tools#200).
      run: dotnet nuget push **/*.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ github.token }} --no-symbols --skip-duplicate
